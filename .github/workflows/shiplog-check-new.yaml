# TEST COPY. Generated by make-variants.py from primus.workflows. Do not edit.
name: shiplog-check
on:
  workflow_call:
    inputs:
      PRIMUS_REF:
        description: 'The primus ref to checkout.'
        required: true
        default: 'main'
        type: string
      SHIPLOG_CONFIG:
        description: 'The path to the shiplog configuration of the repository.'
        required: false
        default: '.shiplog/config.yaml'
        type: string
      SHIPLOG_SKIP_ACTORS:
        description: 'Comma-separated PR authors that need no entry. The author counts, not who ran the event: a maintainer who labels a Dependabot PR does not start the check.'
        required: false
        default: 'dependabot[bot],renovate[bot]'
        type: string

defaults:
  run:
    shell: bash

env:
  PRIMUS_HOME: .primus
  MAKE: make --no-print-directory --makefile=.primus/src/make/main.mk

jobs:
  shiplog:
    runs-on: ubuntu-latest
    # In a merge queue the job is skipped, which counts as a pass. The PR already passed.
    # A PR from a fork gets no secrets, so the job skips it. A maintainer adds its entry in a follow-up PR.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(format(',{0},', inputs.SHIPLOG_SKIP_ACTORS), format(',{0},', github.event.pull_request.user.login)) }}
    permissions:
      contents: 'read'
      pull-requests: 'read'
    env:
      SHIPLOG_CONFIG: ${{ inputs.SHIPLOG_CONFIG }}
      SHIPLOG_BASE_BRANCH: ${{ github.base_ref }}
      SHIPLOG_PR_NUMBER: ${{ github.event.pull_request.number }}
      SHIPLOG_PR_TITLE: ${{ github.event.pull_request.title }}
      SHIPLOG_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - name: self-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: primus-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.PRIMUS_REF }}
          path: .primus
          token: ${{ github.token }}
          persist-credentials: false
      - name: info
        run: |
          $MAKE info
      - name: shiplog-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $MAKE shiplog-check
      - name: shiplog-preview
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $MAKE shiplog-preview
