# Shared prereleaser. Opens or refreshes the release PR `chore(release): vX.Y.Z`.
# Run by hand to open it. On every push to main, run with refresh: true to rebuild an open one.
name: prereleaser

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release, such as v0.149.0. Empty: changelog next picks it.'
        required: false
        default: ''
        type: string
      refresh:
        description: 'Rebuild the open release PR from main instead of opening a new one.'
        required: false
        default: false
        type: boolean
      prepare-command:
        description: 'Repo step after changelog update, such as hack/release.sh prepare. Gets VERSION.'
        required: false
        default: ''
        type: string
      changelog-repo:
        description: 'Repo of the changelog tool.'
        required: false
        default: 'SigNoz/changelog'
        type: string
      changelog-version:
        description: 'Tag or commit SHA of the changelog tool.'
        required: true
        type: string
      config:
        required: false
        default: '.chloggen/config.yaml'
        type: string
      base-branch:
        required: false
        default: 'main'
        type: string
    secrets:
      token:
        description: 'primus-bot token. Without it, GITHUB_TOKEN is used and the PR does not start other workflows.'
        required: false

permissions: {}

concurrency:
  group: prereleaser-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.token || github.token }}
      CONFIG: ${{ inputs.config }}
      BASE: ${{ inputs.base-branch }}
      # One release branch per base, so a release from release/v0.148 never touches main's release PR.
      RELEASE_BRANCH: ${{ inputs.base-branch == 'main' && 'changelog/release' || format('changelog/release-{0}', inputs.base-branch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.changelog-repo }}
          ref: ${{ inputs.changelog-version }}
          path: .changelog-tool
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: .changelog-tool/go.mod
          cache: false

      - name: install
        run: |
          go -C .changelog-tool build -o "$RUNNER_TEMP/bin/changelog" .
          rm -rf .changelog-tool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          set -euo pipefail
          # The release PR is the one from the fixed branch. A port PR (chore(changelog): port ...) is not it.
          # The label stops a fork PR from a branch with the same name, because only maintainers add it.
          open=$(gh pr list --state open --base "$BASE" --head "$RELEASE_BRANCH" --label skip-changelog \
            --json number,title --jq '.[0] // empty')
          if [[ "$REFRESH" == "true" ]]; then
            if [[ -z "$open" ]]; then echo "No open release PR. Nothing to refresh."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            current=$(jq -r '.title | sub("^chore\\(release\\): "; "")' <<< "$open")
            pr=$(jq -r .number <<< "$open")
            # Recompute from main, but never go below the open PR's version: an owner may have typed a higher one.
            if ! next=$(changelog --config "$CONFIG" next 2> "$RUNNER_TEMP/next.err"); then
              cat "$RUNNER_TEMP/next.err" >&2
              if grep -q "nothing to release" "$RUNNER_TEMP/next.err"; then
                # A port PR or a reverted entry removed the last one. An empty release PR helps nobody.
                gh pr close "$pr" --delete-branch --comment "No pending entries are left on ${BASE}, so this release PR is closed. Run the prereleaser again when there is something to release."
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              next="$current"
            fi
            version=$(printf '%s\n%s\n' "$current" "$next" | sort -V | tail -n1)
            if [[ "$version" != "$current" ]]; then echo "New entries raise the version: ${current} to ${version}."; fi
            echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$open" ]]; then echo "Release PR #$(jq -r .number <<< "$open") is open. Merge or close it first."; exit 1; fi
            version="${INPUT_VERSION:-$(changelog --config "$CONFIG" next)}"
          fi
          if git rev-parse -q --verify "refs/tags/${version}" > /dev/null; then
            echo "Tag ${version} already exists. Pick another version."; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: update
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREPARE: ${{ inputs.prepare-command }}
        run: |
          set -euo pipefail
          # A missing guide does not stop the release PR: the PR is where the docs owner sees it.
          # The PR body says "Do not merge" until a later refresh finds the page live.
          if ! changelog --config "$CONFIG" docs-check > "$RUNNER_TEMP/docs.txt" 2>&1; then
            echo "::warning::A docs page for a breaking or upgrade-stop entry is not live. The release PR lists it."
          else
            rm "$RUNNER_TEMP/docs.txt"
          fi
          changelog --config "$CONFIG" update --version "$VERSION"
          if [[ -n "$PREPARE" ]]; then bash -c "$PREPARE"; fi

      - name: open-pr
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PR: ${{ steps.version.outputs.pr }}
          # One fixed branch per base: a PR cannot change its head, and a refresh may change the version.
          BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          git config user.name "primus-bot"
          git config user.email "primus-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(release): ${VERSION}"
          # Force: a refresh rebuilds the branch from main. The ruleset dismisses stale approvals.
          git push --force origin "$BRANCH"
          cat > "$RUNNER_TEMP/body.md" <<BODY
          Writes the ${VERSION} section of CHANGELOG.md from the pending entries and deletes them.

          To change the notes, edit the entry files in a PR on ${BASE}. This PR rebuilds when it merges.

          - [ ] Weak notes rewritten: each says what users saw, what changed and what to do
          - [ ] Security fixes have \`security: true\`, including dependency bumps that close a Dependabot security alert (bots add no entry, so add one)
          - [ ] Minimum versions of other SigNoz services or tools are named
          - [ ] Mandatory upgrade stop: \`upgrade_stop: true\` set and the docs owner tagged (guide + upgradeSchema.json)
          BODY
          if [[ -f "$RUNNER_TEMP/docs.txt" ]]; then
            { printf '> [!WARNING]\n> Do not merge. These docs pages are not live yet. Publish them, and the next refresh removes this note.\n\n```\n'
              grep -v '^PASS' "$RUNNER_TEMP/docs.txt"; printf '```\n\n'; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/body2.md"
            mv "$RUNNER_TEMP/body2.md" "$RUNNER_TEMP/body.md"
          fi
          if [[ -n "$PR" ]]; then
            gh pr edit "$PR" --title "chore(release): ${VERSION}" --body-file "$RUNNER_TEMP/body.md"
            echo "Refreshed release PR #${PR} for ${VERSION}."
          else
            # The label lifts the check on the release PR. Create it on a repo's first release.
            gh label create skip-changelog --description "Needs no changelog entry" 2> /dev/null || true
            gh pr create --base "$BASE" --head "$BRANCH" --title "chore(release): ${VERSION}" \
              --label skip-changelog --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: notify
        # A failed refresh leaves the open release PR behind main. Say so on the PR.
        if: ${{ failure() && steps.version.outputs.pr != '' }}
        env:
          PR: ${{ steps.version.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --body "The refresh from ${GITHUB_SHA::7} failed, so this PR may miss changes merged since. Fix it on ${BASE} and rerun: ${RUN_URL}"
